[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.85"

# Bit-exactness rules here: no fast-math (Rust has none), single codegen unit and fat
# LTO so inlining cannot change arithmetic ordering between this and per-module dev builds.
# debug=1 keeps symbols for the perf ledger.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "unwind"
