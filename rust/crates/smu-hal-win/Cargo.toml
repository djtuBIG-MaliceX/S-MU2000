[package]
name = "smu-hal-win"
version.workspace = true
edition.workspace = true
license.workspace = true

# The `windows` crate was NOT needed: winmm/MMCSS/kernel32 are hand-rolled
# extern blocks (paths.rs style) in sys.rs / midi.rs / waveout.rs, and the
# WASAPI `audio out` row (M6b) stayed crate-free too — ole32 COM vtables
# hand-rolled in wasapi.rs (slot order + GUIDs pinned against the mingw
# headers, tests `vtbl_slot_counts`/`guid_pins`). build.rs extracts the
# ground truth's own static x87 sin/cos objects from this machine's
# libmsvcrt.a/libmingwex.a (SMU_MINGW_ROOT override) — the resampler table
# is ONLY bit-exact through them (see wasapi.rs FFI block + build.rs proof).
[dependencies]
smu-hal = { path = "../smu-hal" }
smu-machine = { path = "../smu-machine" }
