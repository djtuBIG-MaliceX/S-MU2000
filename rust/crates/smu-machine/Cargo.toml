[package]
name = "smu-machine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
smu-compat = { path = "../smu-compat" }
smu-sh2 = { path = "../smu-sh2" }
smu-swp30 = { path = "../smu-swp30" }
smu-dev = { path = "../smu-dev" }

# Row gate "wiring/bus map": workspace-root integration test (lib.rs:5).
[[test]]
name = "boot_golden"
path = "../../tests/boot_golden.rs"

# Row gate "MIDI OUT ring" (W-TX): same mount pattern as boot_golden.
[[test]]
name = "midi_out"
path = "../../tests/midi_out.rs"

# Row gate "xgtest port" (S4/W-XG): offline param vectors, same mount pattern.
[[test]]
name = "xg_model"
path = "../../tests/xg_model.rs"

# Row gate "USB host (M37640)" (M7): bus-byte/IRQ/frame vectors offline,
# same mount pattern.
[[test]]
name = "usb"
path = "../../tests/usb.rs"
